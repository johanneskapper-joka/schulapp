<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"><div class="laden">Lädt …</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Neue Version erkennen und einmal automatisch neu laden
      const hatteSteuerung = !!navigator.serviceWorker.controller;
      let neuGeladen = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hatteSteuerung && !neuGeladen) { neuGeladen = true; location.reload(); }
      });
      window.addEventListener('load', async () => {
        const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      });
    }
  </script>
</body>
</html>
